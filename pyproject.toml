[build-system]
requires = [
    "setuptools >= 77.0.3, < 81",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "ap_model_traning"
description = "Package to train a SEM segmentation model for adaptive polish"
license = { file = "LICENSE" }
dynamic = [
    "version",
    "readme",
]
authors = [
    { name = "Thomas Fish", email = "thomas.fish@rfi.ac.uk" },
    { name = "Casper Berger", email = "casper.berger@rfi.ac.uk" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
requires-python = ">=3.9, <3.14"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "segmentation-models-pytorch>=0.2.0",
    "monai[pillow,pandas,scipy,matplotlib,mlflow,tqdm,tifffile,itk,tensorboard,ignite]",
    "torchmetrics",
    "tifffile",
    "imagecodecs",
    "tqdm",
]

[project.urls]
"Source" = "https://github.com/rosalindfranklininstitute/adaptive-milling-training"
"Tracker" = "https://github.com/rosalindfranklininstitute/adaptive-milling-training/issues"

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
version_file = "src/ap_model_training/_version.py"

[tool.setuptools.packages.find]
where = [
    "src",
]
exclude = [
    "tests",
    "scripts",
]

[project.scripts]
"ap-train" = "ap_model_training.cli.train:main"
"ap-refine" = "ap_model_training.cli.refine:main"

[project.optional-dependencies]
scripts = [
    "jupyter",
    "ipywidgets",
]
reporting = [
    "mlflow",
]
all = [
    "ap_model_traning[scripts,reporting]",
]

# Extras that are linked with the PyTorch index for CPU or CUDA version (if using uv)
cpu = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
cu113 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
cu118 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
cu126 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
cu128 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu113" },
        { extra = "cu118" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu113" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu113" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
addopts = "-vvvv --cov=src --cov-report term --cov-report html -p no:faulthandler -p no:napari -p no:napari-plugin-engine -p no:npe2"
testpaths = [
    "tests",
]
norecursedirs = [
    "tests/data",
    "htmlcov",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
follow_untyped_imports = true

[tool.ruff]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "src/**/*.ipynb",
    "tests/**/*.py",
]

[tool.pyright]
reportPrivateImportUsage = "information"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
typing = [
    "mypy",
    "microsoft-python-type-stubs@git+https://github.com/microsoft/python-type-stubs.git",
    "lxml-stubs",
    "types-PySocks",
    "types-Pygments",
    "types-cffi",
    "types-defusedxml",
    "types-openpyxl",
    "types-paramiko",
    "types-psutil",
    "types-pycocotools",
    "types-pysftp",
    "types-pywin32",
    "types-simplejson",
    "types-tabulate",
    "types-ujson",
    "types-xlrd",
]
dev = [
    "ruff",
    { include-group = "test" },
    { include-group = "typing" },
]
